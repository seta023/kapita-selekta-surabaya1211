<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surabaya WebGIS - Emergency & Financial</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Style utama WebGIS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <i class="fa-solid fa-map-location-dot loader-icon"></i>
        <div class="loader-text">LOADING DATA...</div>
    </div>

    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="brand">
            <i class="fa-solid fa-map-marked-alt header-icon"></i>
            <div>
                <h1 id="app-title">WebGIS Surabaya</h1>
                <div class="brand-subtitle">Fasilitas Darurat &amp; Keuangan</div>
            </div>
        </div>
        <div class="nav-actions">
            <!-- Tampil saat belum login -->
            <a href="login.html" id="btn-nav-login" class="btn btn-primary">
                <i class="fa-solid fa-right-to-bracket"></i> Login Admin
            </a>
            <!-- Tampil saat sudah login -->
            <span id="user-greeting" class="user-greeting hidden"></span>
            <button type="button" id="btn-tambah" class="btn btn-success hidden">
                <i class="fa-solid fa-plus"></i> Tambah Fasilitas
            </button>
            <button type="button" id="btn-logout" class="btn btn-outline hidden">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </nav>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Panel Pencarian Fasilitas -->
    <div id="search-panel" class="glass-panel">
        <div class="panel-title">
            <span><i class="fa-solid fa-magnifying-glass"></i> Cari Fasilitas</span>
            <button type="button" id="btn-toggle-search" class="icon-btn" title="Sembunyikan / tampilkan panel">
                <i class="fa-solid fa-chevron-up"></i>
            </button>
        </div>
        <div id="search-body">
            <form id="search-form" novalidate>
                <input type="text" id="search-input" class="form-control" placeholder="Contoh: BCA, Polsek, Rumah Sakit" autocomplete="off">
                <div class="search-row">
                    <select id="search-category" class="form-control">
                        <option value="all">Semua Kategori</option>
                        <option value="emergency">Darurat &amp; Keamanan</option>
                        <option value="financial">Finansial &amp; Bank</option>
                    </select>
                    <button type="submit" id="btn-search" class="btn btn-primary">
                        <i class="fa-solid fa-magnifying-glass"></i> Cari
                    </button>
                    <button type="button" id="btn-reset" class="btn btn-outline" title="Reset pencarian">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                </div>
            </form>
            <div id="search-message" class="message hidden"></div>
            <ul id="search-results" class="search-results"></ul>
        </div>
    </div>

    <!-- Modal Tambah Fasilitas (khusus admin) -->
    <div id="modal-tambah" class="modal-backdrop hidden">
        <div class="modal glass-panel" role="dialog" aria-labelledby="modal-title">
            <div class="modal-header">
                <h2 id="modal-title"><i class="fa-solid fa-location-dot"></i> Tambah Fasilitas Baru</h2>
                <button type="button" id="btn-close-modal" class="icon-btn" title="Tutup">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="form-tambah" novalidate>
                <label for="input-nama">Nama Fasilitas <span class="required">*</span></label>
                <input type="text" id="input-nama" class="form-control" placeholder="Contoh: Klinik Sehat Gubeng" autocomplete="off">

                <label for="input-kategori">Kategori <span class="required">*</span></label>
                <select id="input-kategori" class="form-control">
                    <option value="">-- Pilih Kategori --</option>
                    <option value="emergency">Darurat &amp; Keamanan</option>
                    <option value="financial">Finansial &amp; Bank</option>
                </select>

                <div class="form-grid">
                    <div>
                        <label for="input-lat">Latitude <span class="required">*</span></label>
                        <input type="text" id="input-lat" class="form-control" placeholder="-7.2458" inputmode="decimal" autocomplete="off">
                    </div>
                    <div>
                        <label for="input-lng">Longitude <span class="required">*</span></label>
                        <input type="text" id="input-lng" class="form-control" placeholder="112.7378" inputmode="decimal" autocomplete="off">
                    </div>
                </div>
                <button type="button" id="btn-pick" class="btn btn-link">
                    <i class="fa-solid fa-crosshairs"></i> Ambil koordinat dengan klik di peta
                </button>

                <label for="input-keterangan">Keterangan (opsional)</label>
                <textarea id="input-keterangan" class="form-control" rows="2" placeholder="Contoh: Buka 24 jam"></textarea>

                <div id="form-message" class="message hidden"></div>

                <div class="modal-actions">
                    <button type="button" id="btn-batal" class="btn btn-outline">Batal</button>
                    <button type="submit" id="btn-simpan" class="btn btn-success">
                        <i class="fa-solid fa-floppy-disk"></i> Simpan
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Banner mode pilih koordinat -->
    <div id="pick-banner" class="pick-banner hidden">
        <i class="fa-solid fa-crosshairs"></i> Klik lokasi pada peta untuk mengambil koordinat
        <button type="button" id="btn-cancel-pick" class="btn btn-outline btn-sm">Batal</button>
    </div>

    <!-- Notifikasi (toast) -->
    <div id="toast" class="toast hidden"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <!-- Data (dimuat sebagai JS supaya bisa dibuka langsung via file:// maupun di-deploy) -->
    <script src="data/fasilitas_surabaya.js"></script>
    <script src="data/batas_surabaya.js"></script>

    <!-- Logika aplikasi -->
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
